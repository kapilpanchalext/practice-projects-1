<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket Example</title>
  <style>
    body {
      display: flex;
      justify-content: space-between;
      margin: 20px;
    }
    .editable {
      width: 45%;
      padding: 10px;
      border: 1px solid black;
      min-height: 200px;
    }
    .display {
      width: 45%;
      padding: 10px;
      border: 1px solid black;
      min-height: 200px;
    }
  </style>
</head>
<body>

  <div
    class="editable"
    contenteditable="true"
    id="contentEditableDiv"
    placeholder="Type here..."
  ></div>

  <div class="display" contenteditable="true" id="displayDiv1"></div>
  <div class="display" contenteditable="true" id="displayDiv2"></div>
  <div class="display" contenteditable="true" id="displayDiv3"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
  <script>
    let stompClient = null;

    function connect() {
      const socket = new SockJS('http://localhost:8080/ws');
      stompClient = Stomp.over(socket);

      stompClient.connect({}, function (frame) {
        console.log('Connected: ' + frame);
        stompClient.subscribe('/topic/updates', function (message) {
          document.getElementById('displayDiv1').innerHTML = message.body;
        });
        stompClient.subscribe('/topic/updates', function (message) {
          document.getElementById('displayDiv2').innerHTML = message.body;
        });
        stompClient.subscribe('/topic/updates', function (message) {
          document.getElementById('displayDiv3').innerHTML = message.body;
        });
      });
    }

    function sendText() {
      const newText = document.getElementById('contentEditableDiv').innerHTML;
      if (stompClient && stompClient.connected) {
        stompClient.send("/app/text", {}, newText);
      }
    }

    document.getElementById('contentEditableDiv').addEventListener('input', sendText);
    window.onload = connect;
  </script>

  </body>
</html>
